<!DOCTYPE html>
<!-- Indica al navegador que este documento es HTML5 -->

<html lang="es">
<!-- Define el idioma principal del contenido -->

<head>
    <meta charset="UTF-8">
    <!-- Permite usar caracteres especiales como tildes y ñ -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Hace que la página sea adaptable a celulares y tablets -->

    <title>Login Uniremington</title>
    <!-- Título que aparece en la pestaña del navegador -->

    <link rel="stylesheet" href="styles.css">
    <!-- Conecta este HTML con el archivo CSS externo -->
</head>

<body>
    <!-- Todo lo visible en la página va dentro del body -->

    <div class="login-container">
        <!-- Contenedor principal del formulario -->

        <img src="img/uniremington-logo.png" 
             alt="Logo Uniremington" 
             class="logo">
        <!-- Muestra el logo y usa alt para accesibilidad -->

        <h2>Ingreso al Sistema</h2>
        <!-- Título del formulario -->

        <form>
            <!-- Inicio del formulario -->

            <label for="email">Correo institucional</label>
            <!-- Texto que describe el campo -->

            <input type="email" id="email" 
                   placeholder="usuario@uniremington.edu.co" 
                   required>
            <!-- Campo para escribir el correo, obligatorio -->

            <label for="password">Contraseña</label>
            <!-- Texto que describe el campo -->

            <input type="password" id="password" 
                   placeholder="••••••••" 
                   required>
            <!-- Campo para escribir la contraseña, ocultando caracteres -->

            <button type="submit">Ingresar</button>
            <!-- Botón que envía el formulario -->
        </form>
    </div>

</body>
</html>
